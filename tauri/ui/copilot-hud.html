<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minutes Meeting Helper</title>
  </head>
  <body>
    <div id="root">
      <main id="hud-bootstrap" style="display:grid;place-items:center;width:100%;height:100%;border:1px solid rgba(255,255,255,.16);border-radius:10px;background:#20201f;color:#aaa7a0;font:12px -apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif">
        Loading Meeting Helper…
      </main>
    </div>
    <script>
      const showBootstrapError = (message) => {
        const bootstrap = document.getElementById('hud-bootstrap')
        if (!bootstrap) return
        bootstrap.textContent = `Meeting Helper could not load: ${String(message || 'Unknown error')}`
        bootstrap.style.color = '#ef8a79'
      }
      window.addEventListener('error', (event) => showBootstrapError(event.message))
      window.addEventListener('unhandledrejection', (event) => showBootstrapError(event.reason))
    </script>
    <script type="module" src="/src/copilot-hud.tsx"></script>
  </body>
</html>
