<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minutes Meeting Helper</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --panel: #20201f;
        --surface: #292928;
        --surface-hover: #323230;
        --line: rgba(255, 255, 255, 0.1);
        --line-strong: rgba(255, 255, 255, 0.17);
        --text: #eeeae2;
        --muted: #aaa7a0;
        --faint: #77736c;
        --cyan: #8bd5dd;
        --lavender: #d6c7ff;
        --coral: #ef8a79;
        --green: #68d985;
        --red: #ff5f57;
      }

      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --panel: #f8f4ed;
          --surface: #efebe2;
          --surface-hover: #e7e1d7;
          --line: rgba(26, 25, 22, 0.1);
          --line-strong: rgba(26, 25, 22, 0.18);
          --text: #1a1916;
          --muted: #625e56;
          --faint: #817c73;
          --cyan: #2f6670;
          --lavender: #684f8d;
          --coral: #a34b39;
          --green: #2e7d46;
          --red: #c0392b;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        color: var(--text);
        -webkit-user-select: none;
        user-select: none;
      }

      button {
        font: inherit;
      }

      button:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: -2px;
      }

      .helper,
      .compact-helper {
        width: 100%;
        height: 100%;
        overflow: hidden;
        border: 1px solid var(--line-strong);
        background: var(--panel);
        box-shadow: none;
      }

      .helper {
        display: grid;
        grid-template-rows: 48px auto minmax(0, 1fr) 34px;
        border-radius: 12px;
      }

      .compact-helper {
        display: none;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 6px;
        padding: 0 7px 0 13px;
        border-radius: 999px;
      }

      .toolbar {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding: 0 8px 0 14px;
        border-bottom: 1px solid var(--line);
        cursor: grab;
      }

      .toolbar:active,
      .compact-helper:active {
        cursor: grabbing;
      }

      .identity,
      .status,
      .controls,
      .compact-status,
      .compact-controls {
        display: flex;
        align-items: center;
      }

      .identity {
        gap: 8px;
        min-width: 0;
      }

      .grip {
        display: grid;
        grid-template-columns: repeat(2, 3px);
        grid-template-rows: repeat(3, 3px);
        gap: 2px;
        width: 8px;
        height: 13px;
        flex: 0 0 auto;
        opacity: 0.52;
      }

      .grip i {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--muted);
      }

      .helper-name {
        overflow: hidden;
        font-size: 13px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .privacy {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--muted);
        font-size: 10px;
        white-space: nowrap;
      }

      .privacy::before {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--green);
        content: "";
      }

      .status {
        min-width: 0;
        justify-content: flex-end;
        gap: 6px;
        color: var(--muted);
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 10px;
      }

      .status-dot,
      .compact-dot {
        width: 6px;
        height: 6px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--green);
      }

      [data-state="thinking"] .status-dot,
      [data-state="arming"] .status-dot {
        background: var(--cyan);
      }

      [data-state="paused"] .status-dot {
        background: var(--faint);
      }

      [data-state="degraded"] .status-dot {
        background: var(--coral);
      }

      .controls,
      .compact-controls {
        gap: 3px;
      }

      .icon-button {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }

      .icon-button:hover {
        background: var(--surface);
        color: var(--text);
      }

      .icon-button:disabled {
        cursor: default;
        opacity: 0.42;
      }

      .icon-button.stop:hover {
        color: var(--coral);
      }

      .pause-icon {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .stop-icon {
        width: 9px;
        height: 9px;
        border: 1.5px solid currentColor;
        border-radius: 2px;
      }

      .close-icon {
        font-size: 20px;
        font-weight: 300;
        line-height: 1;
      }

      .collapse-icon,
      .expand-icon {
        position: relative;
        width: 12px;
        height: 12px;
      }

      .collapse-icon::before,
      .collapse-icon::after,
      .expand-icon::before,
      .expand-icon::after {
        position: absolute;
        width: 6px;
        height: 1px;
        background: currentColor;
        content: "";
      }

      .collapse-icon::before {
        top: 3px;
        left: 1px;
        transform: rotate(45deg);
      }

      .collapse-icon::after {
        right: 1px;
        bottom: 3px;
        transform: rotate(45deg);
      }

      .expand-icon::before {
        top: 2px;
        right: 1px;
        transform: rotate(45deg);
      }

      .expand-icon::after {
        bottom: 2px;
        left: 1px;
        transform: rotate(45deg);
      }

      .goal {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 10px;
        padding: 11px 14px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }

      .goal-label {
        padding-top: 1px;
        color: var(--cyan);
        font-size: 10px;
        font-weight: 650;
      }

      .goal-text {
        margin: 0;
        overflow: hidden;
        color: var(--text);
        font-size: 12px;
        line-height: 1.4;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .guidance {
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
        scrollbar-color: var(--line-strong) transparent;
      }

      .lane {
        border-bottom: 1px solid var(--line);
      }

      .lane:last-child {
        border-bottom: 0;
      }

      .lane-toggle {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 12px 14px 7px;
        border: 0;
        background: transparent;
        color: var(--text);
        text-align: left;
        cursor: pointer;
      }

      .lane-toggle:hover {
        background: color-mix(in srgb, var(--surface) 52%, transparent);
      }

      .lane-icon {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--cyan);
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 12px;
        font-weight: 700;
      }

      .lane.follow-up .lane-icon {
        color: var(--lavender);
      }

      .lane.attention .lane-icon {
        color: var(--coral);
      }

      .lane-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        min-width: 0;
      }

      .lane-heading h2 {
        margin: 0;
        overflow: hidden;
        font-size: 12px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .lane-count {
        color: var(--faint);
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 9px;
      }

      .lane-chevron {
        width: 7px;
        height: 7px;
        border-right: 1.5px solid var(--faint);
        border-bottom: 1.5px solid var(--faint);
        transform: rotate(45deg) translateY(-2px);
      }

      .lane.collapsed .lane-chevron {
        transform: rotate(-45deg) translate(-1px, -1px);
      }

      .lane-body {
        padding: 0 14px 13px 52px;
      }

      .lane.collapsed .lane-body {
        display: none;
      }

      .lane-list {
        display: grid;
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .lane-list li {
        position: relative;
        padding-left: 12px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.38;
      }

      .lane-list li::before {
        position: absolute;
        top: 0.58em;
        left: 0;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--faint);
        content: "";
      }

      .lane-list li.current {
        color: var(--text);
      }

      .lane-list li.current::before {
        background: var(--green);
      }

      .lane-list li.empty {
        color: var(--faint);
        font-style: italic;
      }

      .lane-list li.empty::before {
        background: transparent;
        border: 1px solid var(--faint);
      }

      .footer {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        padding: 0 14px;
        border-top: 1px solid var(--line);
        color: var(--faint);
        font-size: 10px;
      }

      .footer::before {
        width: 5px;
        height: 5px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--green);
        content: "";
      }

      .footer span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      [data-state="degraded"] .footer::before {
        background: var(--coral);
      }

      .compact-status {
        min-width: 0;
        gap: 8px;
        cursor: grab;
      }

      .compact-copy {
        display: flex;
        min-width: 0;
        align-items: baseline;
        gap: 7px;
      }

      .compact-label {
        overflow: hidden;
        font-size: 12px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .compact-meta {
        color: var(--muted);
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 10px;
        white-space: nowrap;
      }

      .compact-helper[data-recording="true"] .compact-dot {
        background: var(--red);
      }

      @media (max-width: 420px) {
        .toolbar {
          gap: 5px;
          padding-left: 10px;
        }

        .privacy,
        .status span:last-child,
        .goal-label {
          display: none;
        }

        .goal {
          grid-template-columns: minmax(0, 1fr);
        }

        .lane-toggle {
          padding-right: 10px;
          padding-left: 10px;
        }

        .lane-body {
          padding-right: 10px;
          padding-left: 48px;
        }
      }

      @media (max-height: 360px) {
        .helper {
          grid-template-rows: 44px auto minmax(0, 1fr);
        }

        .footer {
          display: none;
        }

        .goal {
          padding-top: 8px;
          padding-bottom: 8px;
        }

        .lane-toggle {
          padding-top: 8px;
          padding-bottom: 6px;
        }

        .lane-body {
          padding-bottom: 9px;
        }

        .lane-list li:nth-child(n + 3) {
          display: none;
        }
      }

      @media (max-height: 280px) {
        .goal {
          display: none;
        }

        .lane-list li:nth-child(n + 2) {
          display: none;
        }
      }

      @media (min-width: 760px) and (min-height: 340px) {
        .guidance {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          overflow: hidden;
        }

        .lane {
          min-width: 0;
          overflow-y: auto;
          border-right: 1px solid var(--line);
          border-bottom: 0;
        }

        .lane:last-child {
          border-right: 0;
        }

        .lane-toggle {
          grid-template-columns: 28px minmax(0, 1fr) auto;
        }

        .lane-body {
          padding-left: 14px;
        }
      }

      @media (max-height: 100px) {
        .helper {
          display: none;
        }

        .compact-helper {
          display: grid;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .compact-helper[data-recording="true"] .compact-dot {
          animation: recording-pulse 1.2s ease-in-out infinite;
        }

        @keyframes recording-pulse {
          0%,
          100% {
            opacity: 1;
          }

          50% {
            opacity: 0.45;
          }
        }
      }

      @media (forced-colors: active) {
        .helper,
        .compact-helper,
        .lane-icon {
          border-color: CanvasText;
        }
      }
    </style>
  </head>
  <body>
    <main class="helper" id="helper" data-state="arming">
      <header class="toolbar" data-tauri-drag-region>
        <div class="identity" data-tauri-drag-region>
          <span class="grip" aria-hidden="true" data-tauri-drag-region>
            <i></i><i></i><i></i><i></i><i></i><i></i>
          </span>
          <span class="helper-name" data-tauri-drag-region>Meeting Helper</span>
          <span class="privacy" data-tauri-drag-region>Private</span>
        </div>
        <div class="status" role="status" aria-live="polite" data-tauri-drag-region>
          <span class="status-dot" aria-hidden="true"></span>
          <span id="state-label">Preparing</span>
        </div>
        <div class="controls">
          <button class="icon-button" id="collapse" type="button" title="Collapse to recording pill" aria-label="Collapse Meeting Helper">
            <span class="collapse-icon" aria-hidden="true"></span>
          </button>
          <button class="icon-button" id="pause" type="button" title="Pause coaching" aria-label="Pause coaching">
            <span class="pause-icon" id="pause-icon" aria-hidden="true">Ⅱ</span>
          </button>
          <button class="icon-button stop" id="stop" type="button" title="Stop helper and review next steps" aria-label="Stop Meeting Helper and review next steps">
            <span class="stop-icon" aria-hidden="true"></span>
          </button>
          <button class="icon-button" id="close" type="button" title="Close window; coaching continues" aria-label="Close Meeting Helper window">
            <span class="close-icon" aria-hidden="true">×</span>
          </button>
        </div>
      </header>

      <section class="goal" aria-label="Meeting goal">
        <span class="goal-label">Goal</span>
        <p class="goal-text" id="goal-text">Leave with clear decisions, owners, and next steps.</p>
      </section>

      <section class="guidance" aria-label="Live meeting guidance" aria-live="polite">
        <article class="lane cover" data-lane="cover">
          <button class="lane-toggle" type="button" aria-expanded="true" aria-controls="cover-body">
            <span class="lane-icon" aria-hidden="true">↑</span>
            <span class="lane-heading">
              <h2>Points to cover</h2>
              <span class="lane-count" id="cover-count"></span>
            </span>
            <span class="lane-chevron" aria-hidden="true"></span>
          </button>
          <div class="lane-body" id="cover-body">
            <ul class="lane-list" id="cover-list"></ul>
          </div>
        </article>

        <article class="lane follow-up" data-lane="followUp">
          <button class="lane-toggle" type="button" aria-expanded="true" aria-controls="follow-up-body">
            <span class="lane-icon" aria-hidden="true">?</span>
            <span class="lane-heading">
              <h2>Follow up</h2>
              <span class="lane-count" id="follow-up-count"></span>
            </span>
            <span class="lane-chevron" aria-hidden="true"></span>
          </button>
          <div class="lane-body" id="follow-up-body">
            <ul class="lane-list" id="follow-up-list"></ul>
          </div>
        </article>

        <article class="lane attention" data-lane="attention">
          <button class="lane-toggle" type="button" aria-expanded="true" aria-controls="attention-body">
            <span class="lane-icon" aria-hidden="true">!</span>
            <span class="lane-heading">
              <h2>Bring to attention</h2>
              <span class="lane-count" id="attention-count"></span>
            </span>
            <span class="lane-chevron" aria-hidden="true"></span>
          </button>
          <div class="lane-body" id="attention-body">
            <ul class="lane-list" id="attention-list"></ul>
          </div>
        </article>
      </section>

      <footer class="footer">
        <span id="detail">Loading local meeting context.</span>
      </footer>
    </main>

    <aside class="compact-helper" id="compact-helper" data-recording="false" data-tauri-drag-region aria-label="Compact Meeting Helper">
      <div class="compact-status" data-tauri-drag-region>
        <span class="compact-dot" aria-hidden="true"></span>
        <span class="compact-copy" data-tauri-drag-region>
          <span class="compact-label" id="compact-label">Coach active</span>
          <span class="compact-meta" id="compact-meta">Listening</span>
        </span>
      </div>
      <div class="compact-controls">
        <button class="icon-button" id="expand" type="button" title="Expand Meeting Helper" aria-label="Expand Meeting Helper">
          <span class="expand-icon" aria-hidden="true"></span>
        </button>
        <button class="icon-button" id="compact-close" type="button" title="Close window; coaching continues" aria-label="Close Meeting Helper window">
          <span class="close-icon" aria-hidden="true">×</span>
        </button>
      </div>
    </aside>

    <script>
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;
      const currentWindow = window.__TAURI__.window.getCurrentWindow();
      const helper = document.getElementById("helper");
      const compactHelper = document.getElementById("compact-helper");
      const stateLabel = document.getElementById("state-label");
      const goalText = document.getElementById("goal-text");
      const detail = document.getElementById("detail");
      const pauseButton = document.getElementById("pause");
      const pauseIcon = document.getElementById("pause-icon");
      const stopButton = document.getElementById("stop");
      const closeButton = document.getElementById("close");
      const compactCloseButton = document.getElementById("compact-close");
      const collapseButton = document.getElementById("collapse");
      const expandButton = document.getElementById("expand");
      const compactLabel = document.getElementById("compact-label");
      const compactMeta = document.getElementById("compact-meta");
      const expandedSizeKey = "minutes.homebase.coachExpandedSize";
      const collapsedLanesKey = "minutes.homebase.coachCollapsedLanes";
      let snapshot = null;
      let capture = null;
      let resizeTimer = null;

      const stateLabels = {
        off: "Off",
        arming: "Preparing",
        listening: "Listening",
        thinking: "Thinking",
        nudge: "Guidance ready",
        paused: "Paused",
        degraded: "Limited",
      };

      const lanes = {
        cover: {
          list: document.getElementById("cover-list"),
          count: document.getElementById("cover-count"),
          empty: "Listening for the next useful point to raise.",
        },
        followUp: {
          list: document.getElementById("follow-up-list"),
          count: document.getElementById("follow-up-count"),
          empty: "No open follow-up has surfaced yet.",
        },
        attention: {
          list: document.getElementById("attention-list"),
          count: document.getElementById("attention-count"),
          empty: "Nothing needs your attention right now.",
        },
      };

      function stateName(value) {
        const state = String(value || "off").toLowerCase();
        return Object.hasOwn(stateLabels, state) ? state : "degraded";
      }

      function renderLane(name, values, currentNudge) {
        const lane = lanes[name];
        const items = Array.isArray(values)
          ? [...new Set(values.map((value) => String(value).trim()).filter(Boolean))].slice(0, 4)
          : [];
        lane.list.replaceChildren();
        lane.count.textContent = items.length ? String(items.length) : "";

        if (!items.length) {
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = lane.empty;
          lane.list.appendChild(empty);
          return;
        }

        for (const value of items) {
          const item = document.createElement("li");
          item.textContent = value;
          if (currentNudge && value === currentNudge) item.className = "current";
          lane.list.appendChild(item);
        }
      }

      function renderCompact() {
        const recording = Boolean(capture?.recording || capture?.starting);
        const processing = Boolean(capture?.processing);
        const state = stateName(snapshot?.state);
        compactHelper.dataset.recording = String(recording);
        compactLabel.textContent = recording
          ? "Recording"
          : processing
            ? "Processing meeting"
            : snapshot?.active
              ? "Coach active"
              : "Meeting Helper";
        compactMeta.textContent = recording
          ? capture?.elapsed || "Live"
          : processing
            ? capture?.processingStageLabel || "Working"
            : stateLabels[state];
      }

      function render(next) {
        snapshot = next || {};
        const state = stateName(snapshot.state);
        const guidance = snapshot.guidance || {};
        const currentNudge = String(snapshot.nudge?.text || "");
        const fallbackCover = snapshot.goal ? [snapshot.goal] : [];

        helper.dataset.state = state;
        stateLabel.textContent = stateLabels[state];
        goalText.textContent = snapshot.goal || "Leave with clear decisions, owners, and next steps.";
        goalText.title = goalText.textContent;
        detail.textContent = snapshot.limitation || snapshot.detail || "Private, local meeting guidance.";
        detail.title = detail.textContent;

        renderLane("cover", guidance.cover?.length ? guidance.cover : fallbackCover, currentNudge);
        renderLane("followUp", guidance.followUp, currentNudge);
        renderLane("attention", guidance.attention, currentNudge);

        const paused = Boolean(snapshot.paused) || state === "paused";
        pauseButton.disabled = !snapshot.active;
        pauseButton.setAttribute("aria-label", paused ? "Resume coaching" : "Pause coaching");
        pauseButton.title = paused ? "Resume coaching" : "Pause coaching";
        pauseIcon.textContent = paused ? "▶" : "Ⅱ";
        stopButton.disabled = !snapshot.active;
        renderCompact();
      }

      function loadExpandedSize() {
        try {
          const stored = JSON.parse(localStorage.getItem(expandedSizeKey) || "null");
          if (Number.isFinite(stored?.width) && Number.isFinite(stored?.height)) return stored;
        } catch (_error) {
          return null;
        }
        return null;
      }

      function rememberExpandedSize() {
        if (window.innerHeight <= 120 || window.innerWidth < 380) return;
        localStorage.setItem(
          expandedSizeKey,
          JSON.stringify({ width: window.innerWidth, height: window.innerHeight }),
        );
      }

      async function setCompact(compact) {
        if (compact) rememberExpandedSize();
        const stored = loadExpandedSize();
        await invoke("cmd_set_copilot_hud_compact", {
          compact,
          restoreWidth: stored?.width ?? null,
          restoreHeight: stored?.height ?? null,
        });
      }

      function loadCollapsedLanes() {
        try {
          const lanes = JSON.parse(localStorage.getItem(collapsedLanesKey) || "[]");
          return new Set(Array.isArray(lanes) ? lanes : []);
        } catch (_error) {
          return new Set();
        }
      }

      const collapsedLanes = loadCollapsedLanes();
      for (const laneElement of document.querySelectorAll(".lane")) {
        const name = laneElement.dataset.lane;
        const toggle = laneElement.querySelector(".lane-toggle");
        const setCollapsed = (collapsed) => {
          laneElement.classList.toggle("collapsed", collapsed);
          toggle.setAttribute("aria-expanded", String(!collapsed));
          if (collapsed) collapsedLanes.add(name);
          else collapsedLanes.delete(name);
          localStorage.setItem(collapsedLanesKey, JSON.stringify([...collapsedLanes]));
        };
        setCollapsed(collapsedLanes.has(name));
        toggle.addEventListener("click", () => setCollapsed(!laneElement.classList.contains("collapsed")));
      }

      document.addEventListener("mousedown", (event) => {
        if (event.button !== 0 || event.target.closest("button, a, input, textarea")) return;
        currentWindow.startDragging();
      });

      window.addEventListener("resize", () => {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(rememberExpandedSize, 180);
      });

      collapseButton.addEventListener("click", () => {
        setCompact(true).catch((error) => {
          render({ ...(snapshot || {}), state: "Degraded", limitation: String(error) });
        });
      });

      expandButton.addEventListener("click", () => {
        setCompact(false).catch((error) => {
          render({ ...(snapshot || {}), state: "Degraded", limitation: String(error) });
        });
      });

      pauseButton.addEventListener("click", async () => {
        const paused = Boolean(snapshot?.paused) || stateName(snapshot?.state) === "paused";
        pauseButton.disabled = true;
        try {
          render(await invoke(paused ? "cmd_resume_copilot_surface" : "cmd_pause_copilot_surface"));
        } catch (error) {
          render({ ...(snapshot || {}), state: "Degraded", limitation: String(error) });
        }
      });

      stopButton.addEventListener("click", async () => {
        stopButton.disabled = true;
        try {
          await invoke("cmd_finish_copilot_surface");
          await currentWindow.close();
        } catch (error) {
          stopButton.disabled = false;
          render({ ...(snapshot || {}), state: "Degraded", limitation: String(error) });
        }
      });

      const closeWindow = () => currentWindow.close();
      closeButton.addEventListener("click", closeWindow);
      compactCloseButton.addEventListener("click", closeWindow);

      listen("copilot:state", (event) => render(event.payload));
      listen("copilot:nudge", (event) => {
        render({ ...(snapshot || {}), state: "Nudge", nudge: event.payload });
      });

      async function refreshCapture() {
        try {
          capture = await invoke("cmd_capture_status");
          renderCompact();
        } catch (_error) {
          capture = null;
        }
      }

      invoke("cmd_copilot_surface_status")
        .then(render)
        .catch((error) => {
          render({
            active: false,
            state: "Degraded",
            detail: String(error),
            limitation: String(error),
          });
        });
      refreshCapture();
      window.setInterval(refreshCapture, 1000);
    </script>
  </body>
</html>
